# Render Blueprint: one web service runs the API and serves the React site.
services:
  - type: web
    name: save-lives
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: save-lives
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
